name: Build Resume

on:
  workflow_dispatch:
  push:
    paths:
      - 'resume/ShashankResume.md'
      - 'resume/markdown.css'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and chromium
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pandoc chromium-browser

      - name: Build HTML
        run: |
          cd resume
          pandoc ShashankResume.md -o ShashankResume.html -c markdown.css --standalone

      - name: Build PDF
        run: |
          cd resume
          chromium-browser --headless --no-sandbox --disable-gpu \
            --print-to-pdf=../files/ShashankResume.pdf \
            --print-to-pdf-no-header \
            ShashankResume.html

      - name: Commit output files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume/ShashankResume.html files/ShashankResume.pdf
          git diff --staged --quiet || git commit -m "chore: rebuild resume [skip ci]"
          git push
