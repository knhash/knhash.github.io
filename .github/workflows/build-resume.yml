name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          texlive-latex-base texlive-latex-extra texlive-fonts-recommended
          texlive-latex-recommended lmodern latexmk

      - name: Build site (resume PDFs + static files + redirects)
        run: make site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/legacy

  deploy-github-pages:
    # Keeps knhash.github.io/files/..., /media/... and old-URL redirects alive, always serving the latest build.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    # files.knhash.in and media.knhash.in. Skipped until the CLOUDFLARE_* secrets exist.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download site
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: site
          path: build
      - name: Deploy files.knhash.in
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          command: pages deploy build/files --project-name=knhash-files --branch=main
      - name: Deploy media.knhash.in
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          command: pages deploy build/media --project-name=knhash-media --branch=main
