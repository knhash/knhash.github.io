name: Build Resume PDF

on:
  push:
    paths:
      - 'resume/ShashankResume.tex'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeXLive
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Compile LaTeX and copy to files/
        run: |
          cd resume
          latexmk -C # Clean all build artifacts to force rebuild
          latexmk -pdf -interaction=nonstopmode ShashankResume.tex
          cp ShashankResume.pdf ../files/ShashankResume.pdf

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files/ShashankResume.pdf
          git diff --cached --quiet || git commit -m "Update resume PDF [skip ci]"
          git push
