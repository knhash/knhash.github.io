name: Generate Resume PDF

on:
  push:
    paths:
      - 'resume/ShashankResume.md'
      - 'resume/markdown.css'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i pandoc-3.6.4-1-amd64.deb

      - name: Install Chromium
        run: sudo apt-get install -y chromium-browser

      - name: Generate self-contained HTML
        run: |
          cd resume
          pandoc ShashankResume.md \
            -o ShashankResume.html \
            -c markdown.css \
            --standalone \
            --embed-resources \
            --from markdown+fenced_divs

      - name: Generate PDF via Chromium headless
        run: |
          cd resume
          chromium-browser \
            --headless=new \
            --no-sandbox \
            --no-pdf-header-footer \
            --print-to-pdf=../files/ShashankResume.pdf \
            "file://$PWD/ShashankResume.html"

      - name: Commit PDF back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files/ShashankResume.pdf
          git diff --cached --quiet || git commit -m "chore: regenerate ShashankResume.pdf [skip ci]"
          git push
